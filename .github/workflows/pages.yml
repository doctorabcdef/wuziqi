name: Deploy game to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Select public website files
        run: |
          mkdir public-site
          cp index.html styles.css app.js chat.js voice-clips.js config.js favicon.svg public-site/
          cp -R assets public-site/assets
          touch public-site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public-site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
